name: Coletar anúncios

on:
  schedule:
    - cron: "15 10 * * *"   # todo dia às 07:15 (horário de Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node coletor.mjs
      - name: Salvar resultado
        run: |
          git config user.name "radar-aluguel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza anúncios $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
